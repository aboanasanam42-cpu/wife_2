name: CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  python-engine:
    name: Python Trading Engine Validation
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Python Syntax Validation
        run: |
          python -m py_compile main.py config.py strategy.py exchange_client.py notifier.py

      - name: Strategy Smoke Test
        run: |
          python - <<'PY'
          import pandas as pd
          from strategy import SpotStrategy

          strat = SpotStrategy()
          rows = []
          price = 100.0
          for i in range(80):
              price *= 1.0 + (0.0005 if i % 3 else -0.0003)
              rows.append([i, price, price * 1.001, price * 0.999, price, 1000])
          df = pd.DataFrame(rows, columns=["timestamp", "open", "high", "low", "close", "volume"])
          result = strat.evaluate_entry_signal("MX/USDT", df, {}, "slot-1")
          assert result.action in {"BUY", "HOLD"}
          assert result.price >= 0
          print("Strategy smoke test passed:", result)
          PY
