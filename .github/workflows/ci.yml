name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  python-engine:
    name: Python Trading Engine Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax Check & Import Validation
        run: |
          python -m py_compile main.py config.py strategy.py notifier.py exchange_client.py

      - name: Validate Strategy Unit Logic
        run: |
          python -c "
          from strategy import SpotStrategy
          strat = SpotStrategy()
          print('SpotStrategy initialized successfully with RSI limits:', strat.rsi_oversold, strat.rsi_overbought)
          "

  android-build:
    name: Android Build & Unit Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Android Unit Tests
        run: |
          ./gradlew testDebugUnitTest --no-daemon || gradle testDebugUnitTest --no-daemon
