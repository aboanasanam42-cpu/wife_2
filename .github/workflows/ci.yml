name: MEXC Futures Worker CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile
        run: python -m py_compile bot.py grid_worker.py

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Import check
        run: python -c "import grid_worker; print('worker import OK')"

      - name: Required files
        run: |
          test -f bot.py
          test -f grid_worker.py
          test -f requirements.txt
          test -f Procfile
          test -f runtime.txt
          test -f .env.example
          test -f .gitignore